<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成都宣传片 · 天府之国</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ul {
            list-style: none;
        }

        /* 导航栏 */
        nav {
            width: 100%;
            height: 70px;
            background-color: rgba(0,0,0,0.65);
            position: fixed;
            top:0;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding:0 40px;
            color: #fff;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .nav-menu {
            display: flex;
            gap: 35px;
        }
        .nav-menu li a:hover {
            color: #ffc107;
        }

        /* 首屏横幅 宣传片封面 */
        .banner {
            width:100%;
            height:100vh;
            background: linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
            url("https://img1.baidu.com/it/u=1670432138,3280102130&fm=253&fmt=auto&app=138&f=JPEG?w=1920&h=950") center/cover no-repeat;
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color:#fff;
            text-align:center;
        }
        .banner h1 {
            font-size: 56px;
            margin-bottom:16px;
        }
        .banner p {
            font-size: 20px;
            margin-bottom: 32px;
        }
        .play-btn {
            padding:14px 36px;
            background: #ffc107;
            color:#000;
            font-size:18px;
            border-radius: 50px;
            border:none;
            cursor:pointer;
            transition: 0.3s;
        }
        .play-btn:hover {
            background:#ffb300;
            transform: scale(1.05);
        }

        /* 通用区块 */
        section {
            padding: 80px 40px;
        }
        .section-title {
            text-align:center;
            font-size:32px;
            margin-bottom:50px;
            color:#222;
        }

        /* 宣传片区域 */
        .video-wrap {
            max-width:900px;
            margin:0 auto;
            background:#000;
            border-radius:12px;
            overflow:hidden;
            aspect-ratio: 16 / 9;   /* 宽高比：16/9，可改 4/3、21/9、9/16 */
        }
        .video-wrap video {
            width:100%;
            height:100%;
            display:block;
            background:#000;
            object-fit: contain;    /* 完整显示不变形；要铺满裁切改成 cover */
            object-position: center;
        }

        /* 景点卡片 */
        .spot-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
            gap:28px;
            max-width:1200px;
            margin:0 auto;
        }
        .spot-card {
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 4px 14px #00000022;
            transition:0.3s;
        }
        .spot-card:hover {
            transform: translateY(-8px);
        }
        .spot-card img {
            width:100%;
            height:200px;
            object-fit:cover;
        }
        .spot-text {
            padding:18px;
        }
        .spot-text h3 {
            margin-bottom:10px;
        }
        .spot-text p {
            color:#666;
            font-size:14px;
            line-height:1.6;
        }

        /* 美食板块 */
        .food-bg {
            background-color: #f9f6f0;
        }
        .food-list {
            max-width:1100px;
            margin:0 auto;
            display:flex;
            flex-wrap:wrap;
            gap:24px;
            justify-content:center;
        }
        .food-item {
            width:220px;
            text-align:center;
        }
        .food-item img {
            width:100%;
            height:180px;
            border-radius:10px;
            object-fit:cover;
        }
        .food-item h4 {
            margin-top:10px;
        }

        /* 页脚 */
        footer {
            background:#222;
            color:#fff;
            text-align:center;
            padding:30px;
        }

        /* 移动端适配 */
        @media (max-width:768px) {
            .banner h1 {
                font-size:36px;
            }
            nav {
                padding:0 20px;
            }
            .nav-menu {
                gap:15px;
                font-size:14px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <nav>
        <div class="logo">天府成都</div>
        <ul class="nav-menu">
            <li><a href="#home">首页</a></li>
            <li><a href="#video">宣传片</a></li>
            <li><a href="#spot">名胜景点</a></li>
            <li><a href="#food">成都美食</a></li>
            <li><a href="#contact">联系我们</a></li>
        </ul>
    </nav>

    <!-- 首屏 -->
    <div class="banner" id="home">
        <h1>天府之国 · 安逸成都</h1>
        <p>一座来了就不想离开的城市，千年蜀韵，烟火人间</p>
        <button class="play-btn" onclick="document.getElementById('cv').scrollIntoView({behavior:'smooth'})">观看城市宣传片</button>
    </div>

    <!-- 宣传片区域 -->
    <section id="video">
        <h2 class="section-title">成都城市宣传片</h2>
        <div class="video-wrap">
            <video id="cv" controls poster="https://img0.baidu.com/it/u=3066114414,1142021313&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=450">
                <source src="视频.mp4" type="video/mp4">
                
            </video>
        </div>
    </section>

    <!-- 景点 -->
    <section id="spot">
        <h2 class="section-title">打卡成都名胜</h2>
        <div class="spot-container">
            <div class="spot-card">
                <img src="大熊猫.png" alt="大熊猫基地">
                <div class="spot-text">
                    <h3>成都大熊猫繁育研究基地</h3>
                    <p>国宝大熊猫的家园，软萌治愈，来成都必打卡！</p>
                </div>
            </div>
            <div class="spot-card">
                <img src="宽窄.png" alt="宽窄巷子">
                <div class="spot-text">
                    <h3>宽窄巷子</h3>
                    <p>老成都街巷缩影，青砖黛瓦，喝茶听曲感受慢生活。</p>
                </div>
            </div>
            <div class="spot-card">
                <img src="都江堰.png" alt="都江堰">
                <div class="spot-text">
                    <h3>都江堰</h3>
                    <p>世界水利奇迹，两千多年守护天府平原。</p>
                </div>
            </div>
            <div class="spot-card">
                <img src="锦里.png" alt="锦里">
                <div class="spot-text">
                    <h3>锦里古街</h3>
                    <p>夜晚灯火璀璨，三国风情，热闹的市井长街。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 美食 -->
    <section class="food-bg" id="food">
        <h2 class="section-title">成都特色美食</h2>
        <div class="food-list">
            <div class="food-item">
                <img src="火锅.png" alt="火锅">
                <h4>麻辣火锅</h4>
            </div>
            <div class="food-item">
                <img src="面.png" alt="担担面">
                <h4>担担面</h4>
            </div>
            <div class="food-item">
                <img src="兔头.png" alt="兔头">
                <h4>五香兔头</h4>
            </div>
            <div class="food-item">
                <img src="冰粉.png" alt="冰粉">
                <h4>手工冰粉</h4>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer id="contact">
        <p>天府成都宣传片网站 © 2026 | 安逸成都，欢迎您</p>
    </footer>

    <script>
        // 滚动导航效果
        window.addEventListener('scroll', ()=>{
            const nav = document.querySelector('nav');
            if(window.scrollY > 80){
                nav.style.background = "rgba(0,0,0,0.9)";
            }else{
                nav.style.background = "rgba(0,0,0,0.65)";
            }
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简约个人名片</title>
    <!-- 引入外部 CSS 样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 名片卡片容器 -->
    <div class="card">
        <!-- 圆形头像区域 -->
        <div class="avatar">
            <!-- 替换为你的头像图片链接 -->
            <img src="https://via.placeholder.com/120" alt="个人头像">
        </div>
        
        <!-- 个人信息区域 -->
        <div class="info">
            <h1 class="name">张三</h1>
            <p class="title">高级前端工程师</p>
            <p class="contact"> 138-0000-0000</p>
            <p class="contact">️ zhangsan@example.com</p>
        </div>
    </div>
</body>
</html>
